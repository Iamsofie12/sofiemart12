<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofie · Tous mes liens</title>
<meta name="description" content="Pour mieux me connaître : retrouve Sofie sur Instagram, TikTok, Facebook et soutiens son aventure tennis.">
<meta property="og:title" content="Sofie · Tous mes liens">
<meta property="og:description" content="Suis-moi partout : Instagram, TikTok, Facebook, tennis et plus.">
<style>
  :root {
    --cream: #f7efe4;
    --sand: #ead9c3;
    --latte: #c9a47e;
    --caramel: #a9744a;
    --cocoa: #5c3d2a;
    --espresso: #3b2619;
    --card: rgba(255,255,255,.62);
    --border: rgba(169,116,74,.28);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--espresso);
    background:
      radial-gradient(40rem 24rem at 90% -5%, rgba(201,164,126,.45), transparent 60%),
      radial-gradient(36rem 22rem at -10% 40%, rgba(234,217,195,.9), transparent 60%),
      linear-gradient(180deg, var(--cream), var(--sand));
    background-attachment: fixed;
    display: flex; justify-content: center;
    padding: 56px 16px 0;
    overflow-x: hidden;
  }
  main { width: 100%; max-width: 480px; text-align: center; padding-bottom: 110px; }

  /* Avatar */
  .avatar-wrap { position: relative; width: 132px; margin: 0 auto 18px; }
  .avatar {
    width: 132px; height: 132px; border-radius: 50%;
    background: linear-gradient(145deg, var(--sand), var(--latte));
    box-shadow: 0 0 0 5px #fff, 0 0 0 7px var(--latte), 0 14px 30px rgba(92,61,42,.25);
    overflow: hidden; position: relative; display: grid; place-items: end center;
  }
  .avatar svg { width: 104px; height: 104px; --fur: #fff; --inner: #f1c9bd; margin-bottom: -6px; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; }

  /* Galerie photos */
  .gallery {
    margin: 24px -16px 0; padding: 4px 16px 10px;
    display: flex; gap: 10px; overflow-x: auto;
    scroll-snap-type: x proximity; scrollbar-width: none;
  }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery img {
    height: 210px; width: auto; flex: none; scroll-snap-align: center;
    border-radius: 16px; border: 3px solid #fff;
    box-shadow: 0 6px 16px rgba(92,61,42,.22);
    background: var(--sand);
  }
  .peek { position: absolute; top: -34px; width: 40px; height: 52px; z-index: -1; }
  .peek.l { left: 8px; transform-origin: bottom center; animation: wiggle 3.6s ease-in-out infinite; }
  .peek.r { right: 8px; transform-origin: bottom center; animation: wiggle 3.6s ease-in-out .5s infinite reverse; }
  .peek svg { width: 100%; height: 100%; overflow: visible; }
  .heart { position: absolute; right: -14px; top: 6px; font-size: 20px; animation: float 3s ease-in-out infinite; }

  h1 { font-size: 1.75rem; letter-spacing: -.01em; color: var(--cocoa); }
  .tag { margin-top: 6px; color: var(--caramel); font-size: 1rem; font-weight: 500; }

  /* Liens */
  .links { margin-top: 26px; display: grid; gap: 12px; }
  .section { margin: 14px 4px -2px; text-align: left; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--caramel); font-weight: 600; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(92,61,42,.08);
    color: inherit; text-decoration: none; text-align: left;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    animation: rise .5s ease both;
  }
  .link:hover, .link:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(92,61,42,.16); border-color: var(--caramel); outline: none; }
  .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: linear-gradient(145deg, var(--sand), #e1c7a8); }
  .ico svg { width: 22px; height: 22px; stroke: var(--cocoa); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .link .t { display: block; font-weight: 650; color: var(--cocoa); }
  .link .s { display: block; font-size: .85rem; color: #8a6a52; margin-top: 2px; }
  .link .arrow { margin-left: auto; color: var(--latte); font-size: 1.3rem; }

  .link.support { background: linear-gradient(135deg, var(--caramel), var(--cocoa)); border-color: transparent; }
  .link.support .ico { background: rgba(255,255,255,.2); }
  .link.support .ico svg { stroke: #fff; }
  .link.support .t { color: #fff; }
  .link.support .s { color: #f2dfcb; }
  .link.support .arrow { color: #f2dfcb; }

  footer { margin-top: 30px; font-size: .8rem; color: #8a6a52; }

  /* Lapins qui sautent */
  .meadow { position: fixed; left: 0; right: 0; bottom: 0; height: 92px; pointer-events: none; overflow: hidden; }
  .meadow::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(180deg, rgba(201,164,126,0), rgba(201,164,126,.55)); }
  .hopper { position: absolute; bottom: 8px; width: 54px; height: 54px; left: -70px; animation: cross 16s linear infinite; z-index: 1; }
  .hopper svg { width: 100%; height: 100%; animation: hop .8s ease-in-out infinite; transform-origin: bottom center; }
  .hopper.white svg { --fur: #fff; --inner: #f1c9bd; }
  .hopper.brown { animation-duration: 22s; animation-delay: -9s; width: 44px; height: 44px; }
  .hopper.brown svg { --fur: #b98a63; --inner: #e7c3a3; animation-duration: .65s; }
  .eye { animation: blink 5s infinite; transform-origin: center; transform-box: fill-box; }

  @keyframes cross { from { left: -70px; } to { left: calc(100% + 20px); } }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.06,.92); } 50% { transform: translateY(-22px) scale(.96,1.06); } }
  @keyframes wiggle { 0%,80%,100% { transform: rotate(0); } 86% { transform: rotate(-9deg); } 93% { transform: rotate(7deg); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(6deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .hopper.brown { display: none; } .hopper.white { left: 20px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bunny" viewBox="0 0 80 84">
    <ellipse cx="40" cy="68" rx="21" ry="13" fill="var(--fur)"/>
    <circle cx="62" cy="70" r="6" fill="var(--fur)"/>
    <ellipse cx="27" cy="22" rx="7.5" ry="19" fill="var(--fur)" transform="rotate(-8 27 22)"/>
    <ellipse cx="27" cy="24" rx="3.6" ry="13" fill="var(--inner)" transform="rotate(-8 27 22)"/>
    <ellipse cx="53" cy="22" rx="7.5" ry="19" fill="var(--fur)" transform="rotate(8 53 22)"/>
    <ellipse cx="53" cy="24" rx="3.6" ry="13" fill="var(--inner)" transform="rotate(8 53 22)"/>
    <ellipse cx="40" cy="48" rx="22" ry="19" fill="var(--fur)"/>
    <circle cx="24.5" cy="53" r="4" fill="#f4b9b0" opacity=".65"/>
    <circle cx="55.5" cy="53" r="4" fill="#f4b9b0" opacity=".65"/>
    <ellipse class="eye" cx="32" cy="46" rx="2.4" ry="3" fill="#3b2619"/>
    <ellipse class="eye" cx="48" cy="46" rx="2.4" ry="3" fill="#3b2619"/>
    <ellipse cx="40" cy="52" rx="2.6" ry="1.9" fill="#d98f84"/>
    <path d="M40 54v2.5m0 0c-1.6 1.8-3.8 1.8-5 .4m5-.4c1.6 1.8 3.8 1.8 5 .4" fill="none" stroke="#a9744a" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
</svg>

<main>
  <div class="avatar-wrap">
    <svg class="peek l" viewBox="0 0 40 52" style="--fur:#fff;--inner:#f1c9bd"><ellipse cx="20" cy="30" rx="8" ry="20" fill="var(--fur)" stroke="#e1c7a8"/><ellipse cx="20" cy="32" rx="3.8" ry="13" fill="var(--inner)"/></svg>
    <svg class="peek r" viewBox="0 0 40 52" style="--fur:#b98a63;--inner:#e7c3a3"><ellipse cx="20" cy="30" rx="8" ry="20" fill="var(--fur)"/><ellipse cx="20" cy="32" rx="3.8" ry="13" fill="var(--inner)"/></svg>
    <div class="avatar">
      <svg aria-hidden="true"><use href="#bunny"/></svg>
      <img src="images/avatar.jpg" alt="Sofie" onerror="this.remove()">
    </div>
    <span class="heart" aria-hidden="true">🤍</span>
  </div>

  <h1>Sofie</h1>
  <p class="tag">🎾 Pour mieux me connaître · Suis-moi partout</p>

  <div class="gallery" aria-label="Photos">
    <img src="images/n1.jpg" alt="Sofie qui rit sur un court en gazon">
    <img src="images/n2.jpg" alt="Sofie à genoux sur le court avec une raquette en bois">
    <img src="images/n3.jpg" alt="Sofie au filet sous un ciel rose">
    <img src="images/n4.jpg" alt="Sofie souriante sur terre battue">
    <img src="images/g1.jpg" alt="Sofie en match de tennis">
    <img src="images/n5.jpg" alt="Sofie en robe noire de tennis">
    <img src="images/n6.jpg" alt="Sofie assise sur le court">
    <img src="images/g3.jpg" alt="Sofie au service">
    <img src="images/n7.jpg" alt="Sofie en plein revers">
    <img src="images/g4.jpg" alt="Sofie sur un balcon au coucher du soleil">
    <img src="images/g5.jpg" alt="Sofie en soirée">
    <img src="images/g6.jpg" alt="Sofie en robe blanche">
  </div>

  <div class="links" id="links"></div>
  <footer>© <span id="year"></span> Sofie · fait avec 🤎</footer>
</main>

<div class="meadow" aria-hidden="true">
  <div class="hopper white"><svg><use href="#bunny"/></svg></div>
  <div class="hopper brown"><svg><use href="#bunny"/></svg></div>
</div>

<script>
  // ✏️ MODIFIE ICI TES LIENS — le reste de la page se met à jour tout seul.
  // Laisse "url" vide ("") pour masquer un bouton.
  var PAYPAL = "https://paypal.me/sofiemart12";

  var ICONS = {
    insta: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24"><path d="M9 12.5a4 4 0 1 0 4 4V3c.3 2.6 2 4.4 5 4.6"/></svg>',
    fb: '<svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
    mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>'
  };

  var GROUPS = [
    { title: "Soutenir", items: [
      { url: PAYPAL, icon: "heart", label: "Me soutenir via PayPal", sub: "Un petit geste, un grand merci 🤍", cls: "support" }
    ]},
    { title: "Mes réseaux", items: [
      { url: "https://www.instagram.com/sofiemart12", icon: "insta", label: "Instagram", sub: "@sofiemart12" },
      { url: "https://www.instagram.com/sofie_tenniss", icon: "insta", label: "Instagram Tennis 🎾", sub: "@sofie_tenniss" },
      { url: "https://www.tiktok.com/@sofiiiie12", icon: "tiktok", label: "TikTok", sub: "@sofiiiie12" },
      { url: "https://www.facebook.com/sofiemart12", icon: "fb", label: "Facebook", sub: "sofiemart12" },
      { url: "https://www.facebook.com/sofie_tenniss", icon: "fb", label: "Facebook Tennis 🎾", sub: "sofie_tenniss" }
    ]},
    { title: "Contact", items: [
      { url: "mailto:sofiemart12@gmail.com", icon: "mail", label: "M'écrire un mail", sub: "sofiemart12@gmail.com" }
    ]}
  ];

  var root = document.getElementById("links"), n = 0;
  GROUPS.forEach(function (g) {
    var items = g.items.filter(function (i) { return i.url; });
    if (!items.length) return;
    var h = document.createElement("div");
    h.className = "section"; h.textContent = g.title;
    root.appendChild(h);
    items.forEach(function (i) {
      var a = document.createElement("a");
      a.className = "link " + (i.cls || "");
      a.style.animationDelay = (n++ * 70) + "ms";
      a.href = i.url;
      if (i.url.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = '<span class="ico">' + ICONS[i.icon] + '</span>' +
        '<span><span class="t">' + i.label + '</span><span class="s">' + i.sub + '</span></span>' +
        '<span class="arrow" aria-hidden="true">›</span>';
      root.appendChild(a);
    });
  });
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
